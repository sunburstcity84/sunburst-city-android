<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#001a4d" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sunburst City" />
  <meta name="description" content="Chat with Mika in Sunburst City — tropical-urban AI companion." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Sunburst City</title>
</head>
<body>
  <!-- Splash -->
  <section id="screen-splash" class="screen screen--splash" aria-label="Splash">
    <div class="splash-logo-wrap">
      <img src="icons/logo.png" alt="Sunburst City" class="splash-logo" width="220" height="220" />
    </div>
  </section>

  <!-- Character intro -->
  <section id="screen-intro" class="screen screen--intro hidden" aria-label="Character intro">
    <div class="intro-card">
      <div id="intro-avatar-stage" class="intro-avatar-stage" aria-hidden="true"></div>
      <h1 class="intro-name" id="intro-name">Mika</h1>
      <p class="intro-role" id="intro-role">Sunburst local</p>
      <p class="intro-one-liner" id="intro-one-liner"></p>
      <p class="intro-bio" id="intro-bio"></p>
      <button type="button" class="btn-primary" id="btn-start">Start chatting</button>
    </div>
    <button type="button" class="btn-back" id="intro-back" aria-label="Leave Sunburst City">←</button>
  </section>

  <!-- Chat -->
  <section id="screen-chat" class="screen screen--chat hidden" aria-label="Chat">
    <header class="chat-topbar">
      <button type="button" class="btn-back btn-back--bar" id="chat-back" aria-label="Back to intro">←</button>
      <img src="icons/icon-192.png" alt="" class="topbar-logo" width="32" height="32" />
      <div class="topbar-meta">
        <span class="topbar-name" id="chat-name">Mika</span>
        <span class="topbar-status" id="chat-status">Online</span>
      </div>
      <label class="tts-toggle" title="Speak replies">
        <input type="checkbox" id="tts-auto" checked />
        <span>Speak</span>
      </label>
      <button type="button" class="btn-gear" id="btn-settings" aria-label="API key settings" title="API key">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.65 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.77 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.13.22.4.3.59.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h4c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.09.46 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
        </svg>
      </button>
    </header>

    <div id="gemini-banner" class="gemini-banner hidden" role="status">
      <p class="gemini-banner-text">
        For human-like chat, add a
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">free Gemini key</a>
        (no credit card).
      </p>
      <div class="gemini-banner-actions">
        <button type="button" class="btn-banner" id="banner-add-key">Add key</button>
        <button type="button" class="btn-banner btn-banner--ghost" id="banner-dismiss" aria-label="Dismiss">Not now</button>
      </div>
    </div>

    <div id="chat-avatar-stage" class="chat-avatar-stage" aria-hidden="true"></div>

    <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <p class="empty-text">Say hi…</p>
      </div>
    </div>

    <div class="typing-bar hidden" id="typing-bar" aria-hidden="true">
      <span class="typing-dots"><i></i><i></i><i></i></span>
      <span id="typing-label">Mika is typing…</span>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="composer-input">Message</label>
      <textarea
        id="composer-input"
        rows="1"
        placeholder="Message Mika…"
        enterkeyhint="send"
        maxlength="2000"
      ></textarea>
      <button type="submit" class="btn-send" id="btn-send" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </section>

  <!-- Settings sheet (API key) -->
  <div id="settings-overlay" class="settings-overlay hidden" aria-hidden="true">
    <div class="settings-sheet" role="dialog" aria-labelledby="settings-title" aria-modal="true">
      <div class="settings-head">
        <h2 id="settings-title">Gemini API key</h2>
        <button type="button" class="btn-sheet-close" id="settings-close" aria-label="Close">✕</button>
      </div>
      <p class="settings-help">
        Free tier from
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>
        — no credit card. Key stays on this device only (localStorage). Never commit it.
      </p>
      <label class="settings-label" for="settings-key">Paste key</label>
      <input
        type="password"
        id="settings-key"
        class="settings-input"
        autocomplete="off"
        spellcheck="false"
        placeholder="AIza…"
      />
      <p class="settings-status" id="settings-status" aria-live="polite"></p>
      <div class="settings-actions">
        <button type="button" class="btn-primary" id="settings-save">Save</button>
        <button type="button" class="btn-secondary" id="settings-clear">Clear</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
